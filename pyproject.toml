[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physdraw"
version = "0.1.0"
description = "A declarative Python DSL for textbook-grade physics diagrams."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "physdraw contributors" }]
keywords = ["physics", "diagrams", "svg", "visualization", "education", "mechanics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["physdraw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "examples/out", "**/._*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "RUF"]
# Vector/Theme are frozen value objects: call-in-default is intentional.
ignore = ["B008", "RUF009"]
